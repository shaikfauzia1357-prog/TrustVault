
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TrustVault</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f0f4f8;
      margin: 0;
      color: #233044;
    }

    header {
      background: #173b67;
      color: white;
      padding: 20px;
      text-align: center;
    }

    main {
      background: white;
      max-width: 480px;
      margin: 30px auto;
      padding: 24px;
      border-radius: 12px;
    }

    input, button {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin: 8px 0;
    }

    button {
      background: #1769aa;
      color: white;
      border: 0;
      border-radius: 5px;
      cursor: pointer;
    }

    #message {
      overflow-wrap: anywhere;
    }

    li {
      margin-bottom: 12px;
      overflow-wrap: anywhere;
    }

    li button {
      width: auto;
      margin-left: 8px;
    }
  </style>
</head>
<body>
  <header>
    <h1>TrustVault</h1>
    <p>Secure Document Sharing with an Audit Trail</p>
  </header>

  <main>
    <h2>Create Account / Login</h2>

    <input
      id="username"
      autocomplete="username"
      placeholder="Username (3–30 letters, numbers or _)"
    >

    <input
      id="password"
      type="password"
      autocomplete="current-password"
      placeholder="Password (at least 8 characters)"
    >

    <button type="button" onclick="account('register')">Register</button>
    <button type="button" onclick="account('login')">Login</button>
    <button type="button" onclick="logout()">Logout</button>

    <h2>Upload a Document</h2>

    <form id="uploadForm">
      <input
        type="file"
        id="document"
        name="document"
        required
      >
      <button type="submit">Upload Document</button>
    </form>

    <h2>Share a Document</h2>

<form id="permissionForm">
  <input
    type="number"
    id="permissionDocumentId"
    placeholder="Document ID"
    min="1"
    required
  >

  <input
    type="text"
    id="permissionUsername"
    placeholder="Username to share with"
    required
  >

  <select id="permissionType" required>
    <option value="read">Read only</option>
    <option value="edit">Edit</option>
  </select>

  <button type="submit">Grant Permission</button>
</form>
<button
  type="button"
  id="revokePermissionButton"
>
  Revoke Permission
</button>
<h2>Search Documents</h2>

<form id="searchForm">
  <input
    type="text"
    id="searchName"
    placeholder="Search by document name"
  >

  <input
    type="text"
    id="searchOwner"
    placeholder="Search by owner username"
  >

  <input
    type="text"
    id="searchCategory"
    placeholder="Search by category"
  >

  <label for="searchDate">Upload date:</label>
  <input type="date" id="searchDate">

  <button type="submit">Search</button>
  <button type="button" id="clearSearchButton">Clear Search</button>
</form>

<ul id="searchResults"></ul>
    <h2>My Uploaded Documents</h2>
    <button type="button" onclick="loadDocuments()">Refresh Documents</button>
    <ul id="documentsList"></ul>

    <button type="button" onclick="loadAuditLogs()">View Audit Trail</button>
    <ul id="auditList"></ul>

    <p id="message" role="status" aria-live="polite"></p>
  </main>

  <script>
    const message = document.getElementById("message");
    const documentsList = document.getElementById("documentsList");
    const auditList = document.getElementById("auditList");

    let accountViewVersion = 0;

    function clearAccountView() {
      accountViewVersion++;
      documentsList.replaceChildren();
      auditList.replaceChildren();
    }

    async function account(action) {
      clearAccountView();

      try {
        const response = await fetch("/auth/" + action, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            username: document.getElementById("username").value,
            password: document.getElementById("password").value
          })
        });

        const data = await response.json();
        message.textContent = data.message || "Request completed.";

        if (action === "login" && response.ok) {
          await Promise.all([
            loadDocuments(),
            loadAuditLogs()
          ]);
        }
      } catch {
        message.textContent = "Request failed. Please try again.";
      }
    }

    async function logout() {
      clearAccountView();

      try {
        const response = await fetch("/auth/logout", {
          method: "POST"
        });

        const data = await response.json();
        message.textContent = data.message || "Logout request completed.";

        if (response.ok) {
          document.getElementById("username").value = "";
          document.getElementById("password").value = "";
          document.getElementById("document").value = "";
        }
      } catch {
        message.textContent = "Logout failed. Please try again.";
      }
    }
document.getElementById("searchForm").addEventListener(
  "submit",
  async event => {
    event.preventDefault();

    const params = new URLSearchParams({
      name: document.getElementById("searchName").value.trim(),
      owner: document.getElementById("searchOwner").value.trim(),
      category: document.getElementById("searchCategory").value.trim(),
      date: document.getElementById("searchDate").value
    });

    const results = document.getElementById("searchResults");
    results.replaceChildren();
    message.textContent = "Searching documents...";

    try {
      const response = await fetch("/documents/search?" + params.toString());
      const data = await response.json();

      if (!response.ok) {
        message.textContent = data.message || "Search failed.";
        return;
      }

      if (data.length === 0) {
        results.textContent = "No matching documents found.";
        message.textContent = "";
        return;
      }

      data.forEach(doc => {
        const item = document.createElement("li");
        item.textContent =
          `${doc.original_name} — Owner: ${doc.owner} — Category: ${doc.category} — Uploaded: ${doc.uploaded_at} — Permission: ${doc.permission}`;

        const downloadButton = document.createElement("button");
        downloadButton.type = "button";
        downloadButton.textContent = "Download";
        downloadButton.addEventListener("click", () => {
          window.location.href = "/download/" + encodeURIComponent(doc.id);
        });

        item.appendChild(downloadButton);
        results.appendChild(item);
      });

      message.textContent = "Search completed.";
    } catch {
      message.textContent = "Could not search documents.";
    }
  }
);

document.getElementById("clearSearchButton").addEventListener("click", () => {
  document.getElementById("searchForm").reset();
  document.getElementById("searchResults").replaceChildren();
  message.textContent = "";
});
    async function loadDocuments() {
      const version = accountViewVersion;
      documentsList.replaceChildren();

      try {
        const response = await fetch("/documents");

        if (version !== accountViewVersion) return;

        if (!response.ok) {
          documentsList.textContent = "Please log in to view your documents.";
          return;
        }

        const documents = await response.json();

        if (version !== accountViewVersion) return;

        if (documents.length === 0) {
          documentsList.textContent = "No documents uploaded yet.";
          return;
        }

        documents.forEach(doc => {
          const item = document.createElement("li");

          item.appendChild(document.createTextNode(
            `${doc.original_name} — Document ID: ${doc.id} — ${doc.uploaded_at} `
          ));

          const downloadButton = document.createElement("button");
          downloadButton.type = "button";
          downloadButton.textContent = "Download";

          downloadButton.addEventListener("click", () => {
            window.location.href =
              "/download/" + encodeURIComponent(doc.id);
          });

          item.appendChild(downloadButton);

const editButton = document.createElement("button");
editButton.type = "button";
editButton.textContent = "Edit";

editButton.addEventListener("click", async () => {
  const replacement = document.createElement("input");
  replacement.type = "file";
  replacement.accept = "*/*";

  const picker = document.createElement("input");
  picker.type = "file";

  picker.addEventListener("change", async () => {
    const file = picker.files[0];
    if (!file) return;

    const formData = new FormData();
    formData.append("document", file);

    try {
      const response = await fetch(
        `/documents/${encodeURIComponent(doc.id)}/edit`,
        {
          method: "PUT",
          body: formData
        }
      );

      const data = await response.json();
      message.textContent = data.message || "Edit request completed.";

      if (response.ok) {
        await Promise.all([loadDocuments(), loadAuditLogs()]);
      }
    } catch {
      message.textContent = "Could not edit the document.";
    }
  });

  picker.click();
});

item.appendChild(editButton);

const deleteButton = document.createElement("button");
deleteButton.type = "button";
deleteButton.textContent = "Delete";

deleteButton.addEventListener("click", async () => {
  if (!confirm(`Are you sure you want to delete "${doc.original_name}"?`)) {
    return;
  }

  try {
    const response = await fetch(
      `/documents/${encodeURIComponent(doc.id)}`,
      { method: "DELETE" }
    );

    const data = await response.json();
    message.textContent = data.message || "Delete request completed.";

    if (response.ok) {
      await Promise.all([loadDocuments(), loadAuditLogs()]);
    }
  } catch {
    message.textContent = "Could not delete the document.";
  }
});

item.appendChild(deleteButton);
documentsList.appendChild(item);
        });
      } catch {
        if (version === accountViewVersion) {
          documentsList.textContent = "Could not load documents.";
        }
      }
    }

    async function loadAuditLogs() {
      const version = accountViewVersion;
      auditList.replaceChildren();

      try {
        const response = await fetch("/audit-logs");

        if (version !== accountViewVersion) return;

        if (!response.ok) {
          auditList.textContent = "Please log in to view the audit trail.";
          return;
        }

        const logs = await response.json();

        if (version !== accountViewVersion) return;

        if (logs.length === 0) {
          auditList.textContent = "No audit records found.";
          return;
        }

        logs.forEach(log => {
          const item = document.createElement("li");

          item.textContent =
            `${log.original_name} — ${log.action} — ${log.created_at}`;

          auditList.appendChild(item);
        });
      } catch {
        if (version === accountViewVersion) {
          auditList.textContent = "Could not load the audit trail.";
        }
      }
    }
    document.getElementById("permissionForm").addEventListener(
  "submit",
  async event => {
    event.preventDefault();

    const documentId = document.getElementById("permissionDocumentId").value;
    const username = document.getElementById("permissionUsername").value.trim();
    const permission = document.getElementById("permissionType").value;

    try {
      const response = await fetch(`/documents/${documentId}/permissions`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ username, permission })
      });

      const data = await response.json();
      message.textContent = data.message || "Permission request completed.";

      if (response.ok) {
        document.getElementById("permissionForm").reset();
        await Promise.all([loadDocuments(), loadAuditLogs()]);
      }
    } catch {
      message.textContent = "Could not grant permission.";
    }
  }
);

    document.getElementById("revokePermissionButton").addEventListener(
  "click",
  async () => {
    const documentId = document.getElementById("permissionDocumentId").value;
    const username = document.getElementById("permissionUsername").value.trim();

    if (!documentId || !username) {
      message.textContent = "Enter document ID and username first.";
      return;
    }

    try {
      const response = await fetch(
        `/documents/${documentId}/permissions/${encodeURIComponent(username)}`,
        { method: "DELETE" }
      );

      const data = await response.json();
      message.textContent = data.message || "Permission request completed.";

      if (response.ok) {
        await Promise.all([loadDocuments(), loadAuditLogs()]);
      }
    } catch {
      message.textContent = "Could not revoke permission.";
    }
  }
);
    document.getElementById("uploadForm").addEventListener(
      "submit",
      async event => {
        event.preventDefault();

        const file = document.getElementById("document").files[0];

        if (!file) {
          message.textContent = "Please select a document.";
          return;
        }

        const formData = new FormData();
        formData.append("document", file);

        const version = accountViewVersion;

        try {
          const response = await fetch("/upload", {
            method: "POST",
            body: formData
          });

          const data = await response.json();

          if (version !== accountViewVersion) return;

         message.textContent =
  data.message +
  (data.filename ? " File: " + data.filename : "");

          if (response.ok) {
            document.getElementById("document").value = "";

            await Promise.all([
              loadDocuments(),
              loadAuditLogs()
            ]);
          }
        } catch {
          message.textContent =
            "Upload failed. Please check your connection.";
        }
      }
    );
  </script>
</body>
</html>
