
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TrustVault</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f0f4f8;
      margin: 0;
      color: #233044;
    }

    header {
      background: #173b67;
      color: white;
      padding: 20px;
      text-align: center;
    }

    main {
      background: white;
      max-width: 480px;
      margin: 30px auto;
      padding: 24px;
      border-radius: 12px;
    }

    input, button {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin: 8px 0;
    }

    button {
      background: #1769aa;
      color: white;
      border: 0;
      border-radius: 5px;
      cursor: pointer;
    }

    #message {
      overflow-wrap: anywhere;
    }

    li {
      margin-bottom: 12px;
      overflow-wrap: anywhere;
    }

    li button {
      width: auto;
      margin-left: 8px;
    }
  </style>
</head>
<body>
  <header>
    <h1>TrustVault</h1>
    <p>Secure Document Sharing with an Audit Trail</p>
  </header>

  <main>
    <h2>Create Account / Login</h2>

    <input
      id="username"
      autocomplete="username"
      placeholder="Username (3–30 letters, numbers or _)"
    >

    <input
      id="password"
      type="password"
      autocomplete="current-password"
      placeholder="Password (at least 8 characters)"
    >

    <button type="button" onclick="account('register')">Register</button>
    <button type="button" onclick="account('login')">Login</button>
    <button type="button" onclick="logout()">Logout</button>

    <h2>Upload a Document</h2>

    <form id="uploadForm">
      <input
        type="file"
        id="document"
        name="document"
        required
      >
      <button type="submit">Upload Document</button>
    </form>

    <h2>My Uploaded Documents</h2>
    <button type="button" onclick="loadDocuments()">Refresh Documents</button>
    <ul id="documentsList"></ul>

    <button type="button" onclick="loadAuditLogs()">View Audit Trail</button>
    <ul id="auditList"></ul>

    <p id="message" role="status" aria-live="polite"></p>
  </main>

  <script>
    const message = document.getElementById("message");
    const documentsList = document.getElementById("documentsList");
    const auditList = document.getElementById("auditList");

    let accountViewVersion = 0;

    function clearAccountView() {
      accountViewVersion++;
      documentsList.replaceChildren();
      auditList.replaceChildren();
    }

    async function account(action) {
      clearAccountView();

      try {
        const response = await fetch("/auth/" + action, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            username: document.getElementById("username").value,
            password: document.getElementById("password").value
          })
        });

        const data = await response.json();
        message.textContent = data.message || "Request completed.";

        if (action === "login" && response.ok) {
          await Promise.all([
            loadDocuments(),
            loadAuditLogs()
          ]);
        }
      } catch {
        message.textContent = "Request failed. Please try again.";
      }
    }

    async function logout() {
      clearAccountView();

      try {
        const response = await fetch("/auth/logout", {
          method: "POST"
        });

        const data = await response.json();
        message.textContent = data.message || "Logout request completed.";

        if (response.ok) {
          document.getElementById("username").value = "";
          document.getElementById("password").value = "";
          document.getElementById("document").value = "";
        }
      } catch {
        message.textContent = "Logout failed. Please try again.";
      }
    }

    async function loadDocuments() {
      const version = accountViewVersion;
      documentsList.replaceChildren();

      try {
        const response = await fetch("/documents");

        if (version !== accountViewVersion) return;

        if (!response.ok) {
          documentsList.textContent = "Please log in to view your documents.";
          return;
        }

        const documents = await response.json();

        if (version !== accountViewVersion) return;

        if (documents.length === 0) {
          documentsList.textContent = "No documents uploaded yet.";
          return;
        }

        documents.forEach(doc => {
          const item = document.createElement("li");

          item.appendChild(document.createTextNode(
            `${doc.original_name} — ${doc.uploaded_at} `
          ));

          const downloadButton = document.createElement("button");
          downloadButton.type = "button";
          downloadButton.textContent = "Download";

          downloadButton.addEventListener("click", () => {
            window.location.href =
              "/download/" + encodeURIComponent(doc.id);
          });

          item.appendChild(downloadButton);
          documentsList.appendChild(item);
        });
      } catch {
        if (version === accountViewVersion) {
          documentsList.textContent = "Could not load documents.";
        }
      }
    }

    async function loadAuditLogs() {
      const version = accountViewVersion;
      auditList.replaceChildren();

      try {
        const response = await fetch("/audit-logs");

        if (version !== accountViewVersion) return;

        if (!response.ok) {
          auditList.textContent = "Please log in to view the audit trail.";
          return;
        }

        const logs = await response.json();

        if (version !== accountViewVersion) return;

        if (logs.length === 0) {
          auditList.textContent = "No audit records found.";
          return;
        }

        logs.forEach(log => {
          const item = document.createElement("li");

          item.textContent =
            `${log.original_name} — ${log.action} — ${log.created_at}`;

          auditList.appendChild(item);
        });
      } catch {
        if (version === accountViewVersion) {
          auditList.textContent = "Could not load the audit trail.";
        }
      }
    }

    document.getElementById("uploadForm").addEventListener(
      "submit",
      async event => {
        event.preventDefault();

        const file = document.getElementById("document").files[0];

        if (!file) {
          message.textContent = "Please select a document.";
          return;
        }

        const formData = new FormData();
        formData.append("document", file);

        const version = accountViewVersion;

        try {
          const response = await fetch("/upload", {
            method: "POST",
            body: formData
          });

          const data = await response.json();

          if (version !== accountViewVersion) return;

          message.textContent =
            data.message +
            (data.filename ? " File: " + data.filename : "");

          if (response.ok) {
            document.getElementById("document").value = "";

            await Promise.all([
              loadDocuments(),
              loadAuditLogs()
            ]);
          }
        } catch {
          message.textContent =
            "Upload failed. Please check your connection.";
        }
      }
    );
  </script>
</body>
</html>
